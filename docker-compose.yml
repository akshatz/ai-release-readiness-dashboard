version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Devops/dockerfilebackend.dockerfile
      
    container_name: release-readiness-backend

    ports:
      - "8001:8000"

    volumes:
      - ./backend:/app

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Devops/dockerfilefrontend.dockerfile
    env_file: frontend/.env
    
    container_name: release-readiness-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    depends_on:
      - backend

    restart: unless-stopped